<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>应用包链接 · 演示</title><style>body{background:#f3f7fb;font:15px Arial,sans-serif;color:#606266;margin:0;padding:60px 20px}main{max-width:480px;background:white;border-radius:10px;margin:auto;padding:32px}h1{font-size:24px;color:#303133}p{line-height:1.8;overflow-wrap:anywhere}.note{background:#ecf5ff;padding:16px;color:#409eff}a{color:#409eff}</style><main><h1 id="name">应用包</h1><div id="details"></div><p class="note">这是原型生成的演示页面，安装包未上传到服务器，不提供真实下载。</p><a href="index.html#/APPList">返回商户端</a></main><script>const id=new URLSearchParams(location.search).get('id');let apps=[];try{apps=JSON.parse(localStorage.getItem('apksafe-apps-v1'))||[]}catch{}const app=apps.find(a=>a.id===id);document.getElementById('name').textContent=app?.name||'应用包不可用';const lines=app?['标识：'+app.id,'安装包：'+(app.fileName||app.name+'.apk'),'大小：'+app.size+' MB','添加时间：'+app.created]:['未找到此应用包。演示记录仅在创建记录的浏览器中可见，或该记录已删除。'];for(const line of lines){const p=document.createElement('p');p.textContent=line;document.getElementById('details').append(p)}</script></html>
